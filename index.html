<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Position Sizing</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
    :root {
      --bg:        #0b0f17;
      --surface:   #111827;
      --surface2:  #1a2233;
      --border:    #1f2f47;
      --accent:    #2563eb;
      --accent-hi: #3b82f6;
      --green:     #10b981;
      --red:       #ef4444;
      --amber:     #f59e0b;
      --text:      #f0f4ff;
      --muted:     #6b7fa3;
      --mono:      'JetBrains Mono', monospace;
      --sans:      'Inter', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 48px;
    }
    header {
      display: flex; align-items: baseline; gap: 12px;
      margin-bottom: 28px; border-bottom: 1px solid var(--border); padding-bottom: 16px;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: .02em; }
    header span {
      font-family: var(--mono); font-size: 0.72rem; color: var(--muted);
      background: var(--surface2); padding: 2px 8px; border-radius: 4px;
      border: 1px solid var(--border);
    }
    .layout { display: grid; gap: 14px; max-width: 560px; margin: 0 auto; }

    /* Mode switcher */
    .mode-switch {
      display: flex; gap: 0; border: 1px solid var(--border);
      border-radius: 8px; overflow: hidden;
    }
    .mode-switch button {
      flex: 1; padding: 10px 8px; background: var(--surface2); color: var(--muted);
      border: none; cursor: pointer; font-size: 0.8rem; font-family: var(--sans);
      font-weight: 500; transition: background .15s, color .15s; line-height: 1.3;
    }
    .mode-switch button.active { background: var(--accent); color: #fff; }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 18px;
    }
    .card-title {
      font-size: 0.68rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .1em; color: var(--muted); margin-bottom: 14px;
    }
    .field { margin-bottom: 12px; }
    .field:last-child { margin-bottom: 0; }
    label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
    input[type=number] {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); border-radius: 7px; padding: 10px 12px;
      font-family: var(--mono); font-size: 0.95rem; outline: none;
      transition: border-color .15s;
      -moz-appearance: textfield;
    }
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    input[type=number]:focus { border-color: var(--accent-hi); }

    .stop-toggle {
      display: flex; gap: 0; margin-bottom: 10px;
      border: 1px solid var(--border); border-radius: 7px; overflow: hidden;
    }
    .stop-toggle button {
      flex: 1; padding: 7px; background: var(--surface2); color: var(--muted);
      border: none; cursor: pointer; font-size: 0.77rem; font-family: var(--sans);
      font-weight: 500; transition: background .15s, color .15s;
    }
    .stop-toggle button.active { background: var(--accent); color: #fff; }

    .save-row { display: flex; justify-content: flex-end; margin-top: 8px; }
    .save-row button {
      background: none; border: 1px solid var(--border); color: var(--muted);
      border-radius: 6px; padding: 5px 12px; font-size: 0.73rem; cursor: pointer;
      font-family: var(--sans); transition: border-color .15s, color .15s;
    }
    .save-row button:hover { border-color: var(--accent-hi); color: var(--text); }

    #btn-calc {
      width: 100%; padding: 13px; background: var(--accent);
      color: #fff; border: none; border-radius: 8px; cursor: pointer;
      font-size: 0.95rem; font-weight: 600; font-family: var(--sans);
      transition: background .15s;
    }
    #btn-calc:hover { background: var(--accent-hi); }
    #btn-calc:active { opacity: .85; }

    /* Result */
    #result { display: none; }
    .result-hero {
      text-align: center; padding: 20px 16px 16px;
      background: linear-gradient(135deg, #0f1f3d 0%, #0b1628 100%);
      border: 1px solid var(--accent); border-radius: 10px; margin-bottom: 14px;
    }
    .result-hero .label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 6px; }
    .result-hero .qty { font-family: var(--mono); font-size: 3rem; font-weight: 600; color: var(--accent-hi); line-height: 1; margin-bottom: 4px; }
    .result-hero .qty-label { font-size: 0.78rem; color: var(--muted); }

    /* Suggested stop highlight */
    .stop-suggestion {
      background: #0d2218; border: 1px solid #065f46;
      border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; display: none;
    }
    .stop-suggestion .ss-label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 6px; }
    .stop-suggestion .ss-price { font-family: var(--mono); font-size: 1.8rem; font-weight: 600; color: var(--green); }
    .stop-suggestion .ss-sub { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }

    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .metric {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px;
    }
    .metric .m-label { font-size: 0.66rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
    .metric .m-value { font-family: var(--mono); font-size: 1rem; font-weight: 600; }
    .metric .m-value.green  { color: var(--green); }
    .metric .m-value.red    { color: var(--red); }
    .metric .m-value.amber  { color: var(--amber); }
    .metric .m-value.blue   { color: var(--accent-hi); }

    .divider { height: 1px; background: var(--border); margin: 14px 0; }
    .r-row { display: flex; gap: 8px; }
    .r-chip {
      flex: 1; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 7px; padding: 8px 6px; text-align: center;
    }
    .r-chip .r-label { font-size: 0.63rem; color: var(--muted); margin-bottom: 3px; }
    .r-chip .r-val { font-family: var(--mono); font-size: 0.82rem; font-weight: 600; color: var(--green); }
    .r-chip .r-gain { font-size: 0.65rem; color: var(--muted); margin-top: 2px; }

    .warning {
      background: #2d1a00; border: 1px solid #92400e;
      border-radius: 8px; padding: 10px 14px;
      font-size: 0.78rem; color: #fbbf24; margin-top: 12px; display: none;
    }
  </style>
</head>
<body>

<header>
  <h1>Position Sizing</h1>
  <span>Money Management</span>
</header>

<div class="layout">

  <!-- Mode -->
  <div class="mode-switch">
    <button id="m-qty" class="active" onclick="setCalcMode('qty')">
      Je connais mon stop<br><span style="font-size:.7rem;opacity:.7">→ calcule le nb de titres</span>
    </button>
    <button id="m-stop" onclick="setCalcMode('stop')">
      Je connais mon nb de titres<br><span style="font-size:.7rem;opacity:.7">→ suggère le stop max</span>
    </button>
  </div>

  <!-- Compte -->
  <div class="card">
    <div class="card-title">Compte</div>
    <div class="field">
      <label>Capital (€)</label>
      <input type="number" id="capital" step="100" placeholder="25000" />
    </div>
    <div class="field">
      <label>Risque max par trade (%)</label>
      <input type="number" id="risk-pct" step="0.1" placeholder="0.5" />
    </div>
    <div class="save-row">
      <button id="btn-save">💾 Sauvegarder comme défaut</button>
    </div>
  </div>

  <!-- Ordre -->
  <div class="card">
    <div class="card-title">Ordre</div>
    <div class="field">
      <label>Prix d'achat (€)</label>
      <input type="number" id="price" step="0.0001" placeholder="24.5000" />
    </div>

    <!-- Mode QTY : stop connu -->
    <div id="stop-block">
      <div class="field">
        <label>Stop loss</label>
        <div class="stop-toggle">
          <button id="mode-price" class="active" onclick="setStopMode('price')">Prix (€)</button>
          <button id="mode-pct"   onclick="setStopMode('pct')">Distance (%)</button>
        </div>
        <input type="number" id="stop-val" step="0.0001" placeholder="23.0000" />
      </div>
    </div>

    <!-- Mode STOP : nb titres connu -->
    <div id="qty-block" style="display:none">
      <div class="field">
        <label>Nombre de titres souhaité</label>
        <input type="number" id="qty-input" step="1" min="1" placeholder="100" />
      </div>
    </div>

    <div class="field">
      <label>Frais courtage / ordre (€)</label>
      <input type="number" id="fees" step="0.01" placeholder="1.99" />
    </div>
    <div class="field">
      <label>Slippage (%) <span style="font-size:.7rem;color:var(--muted)">— appliqué au prix d'achat</span></label>
      <input type="number" id="slippage" step="0.01" placeholder="0.15" />
    </div>
  </div>

  <button id="btn-calc" onclick="calculate()">Calculer</button>

  <!-- Résultat -->
  <div id="result">

    <!-- Stop suggéré (mode STOP) -->
    <div class="stop-suggestion" id="stop-suggestion">
      <div class="ss-label">Stop loss maximum suggéré</div>
      <div class="ss-price" id="r-stop-suggested">—</div>
      <div class="ss-sub" id="r-stop-suggested-sub"></div>
    </div>

    <!-- Nb titres (mode QTY) -->
    <div class="result-hero" id="qty-hero">
      <div class="label">Nombre de titres</div>
      <div class="qty" id="r-qty">—</div>
      <div class="qty-label" id="r-qty-sub"></div>
    </div>

    <div class="metrics">
      <div class="metric">
        <div class="m-label">Montant investi</div>
        <div class="m-value blue" id="r-invest">—</div>
      </div>
      <div class="metric">
        <div class="m-label">% du capital</div>
        <div class="m-value blue" id="r-pct-cap">—</div>
      </div>
      <div class="metric">
        <div class="m-label">Risque réel €</div>
        <div class="m-value red" id="r-risk-eur">—</div>
      </div>
      <div class="metric">
        <div class="m-label">Risque réel %</div>
        <div class="m-value red" id="r-risk-pct">—</div>
      </div>
      <div class="metric">
        <div class="m-label">Stop loss</div>
        <div class="m-value amber" id="r-stop">—</div>
      </div>
      <div class="metric">
        <div class="m-label">Distance stop</div>
        <div class="m-value amber" id="r-stop-dist">—</div>
      </div>
    </div>

    <div class="divider"></div>
    <div class="card-title" style="margin-bottom:10px">Objectifs de sortie</div>
    <div class="r-row" id="r-targets"></div>

    <div class="warning" id="r-warning"></div>
  </div>

</div>

<script>
const LS = "mm_defaults";
let stopInputMode = "price";
let calcMode = "qty"; // "qty" | "stop"

function setCalcMode(m) {
  calcMode = m;
  document.getElementById("m-qty").classList.toggle("active", m === "qty");
  document.getElementById("m-stop").classList.toggle("active", m === "stop");
  document.getElementById("stop-block").style.display = m === "qty" ? "block" : "none";
  document.getElementById("qty-block").style.display  = m === "stop" ? "block" : "none";
  document.getElementById("result").style.display = "none";
}

function setStopMode(m) {
  stopInputMode = m;
  document.getElementById("mode-price").classList.toggle("active", m === "price");
  document.getElementById("mode-pct").classList.toggle("active", m === "pct");
  const inp = document.getElementById("stop-val");
  if (m === "price") { inp.step = "0.0001"; inp.placeholder = "23.0000"; }
  else               { inp.step = "0.1";    inp.placeholder = "5.0"; }
}

function loadDefaults() {
  try {
    const d = JSON.parse(localStorage.getItem(LS) || "{}");
    if (d.capital)  document.getElementById("capital").value  = d.capital;
    if (d.riskPct)  document.getElementById("risk-pct").value = d.riskPct;
    if (d.fees)     document.getElementById("fees").value     = d.fees;
    if (d.slippage) document.getElementById("slippage").value = d.slippage;
  } catch {}
}

document.getElementById("btn-save").onclick = () => {
  localStorage.setItem(LS, JSON.stringify({
    capital:  document.getElementById("capital").value,
    riskPct:  document.getElementById("risk-pct").value,
    fees:     document.getElementById("fees").value,
    slippage: document.getElementById("slippage").value,
  }));
  const btn = document.getElementById("btn-save");
  btn.textContent = "✅ Sauvegardé";
  setTimeout(() => btn.textContent = "💾 Sauvegarder comme défaut", 1500);
};

const fmt  = (n, d=2) => n.toLocaleString("fr-FR", {minimumFractionDigits:d, maximumFractionDigits:d});
const fmtE = (n, d=2) => fmt(n,d) + " €";
const fmtP = (n, d=2) => fmt(n,d) + " %";

function calculate() {
  const capital  = parseFloat(document.getElementById("capital").value);
  const riskPct  = parseFloat(document.getElementById("risk-pct").value);
  const price    = parseFloat(document.getElementById("price").value);
  const fees     = parseFloat(document.getElementById("fees").value) || 0;
  const slippage = parseFloat(document.getElementById("slippage").value) || 0;

  if ([capital, riskPct, price].some(isNaN) || price <= 0) {
    alert("Remplis au moins : Capital, Risque %, Prix d'achat."); return;
  }

  const priceReal = price * (1 + slippage / 100);
  const riskMax   = capital * riskPct / 100;
  const budgetNet = riskMax - 2 * fees;

  if (budgetNet <= 0) {
    alert("Les frais dépassent le risque maximum autorisé."); return;
  }

  let qty, stopPrice;

  if (calcMode === "qty") {
    // ── Mode A : stop connu → calcule qty ──
    const stopRaw = parseFloat(document.getElementById("stop-val").value);
    if (isNaN(stopRaw)) { alert("Renseigne le stop loss."); return; }
    stopPrice = stopInputMode === "price" ? stopRaw : priceReal * (1 - stopRaw / 100);
    if (stopPrice >= priceReal) { alert("Le stop doit être inférieur au prix d'achat."); return; }
    const riskPerShare = priceReal - stopPrice;
    qty = Math.floor(budgetNet / riskPerShare);
    if (qty < 1) { alert("Impossible de prendre 1 titre avec ces paramètres."); return; }

  } else {
    // ── Mode B : qty connue → calcule stop max ──
    qty = parseInt(document.getElementById("qty-input").value);
    if (isNaN(qty) || qty < 1) { alert("Renseigne un nombre de titres valide."); return; }
    // stopPrice = priceReal - budgetNet / qty
    const riskPerShare = budgetNet / qty;
    stopPrice = priceReal - riskPerShare;
    if (stopPrice <= 0) { alert("Stop calculé négatif : trop de titres pour ce risque."); return; }
  }

  // Métriques communes
  const riskPerShare = priceReal - stopPrice;
  const invest       = qty * priceReal + fees;
  const lossStop     = qty * riskPerShare + 2 * fees;
  const pctCap       = invest / capital * 100;
  const riskRealPct  = lossStop / capital * 100;
  const stopDist     = (priceReal - stopPrice) / priceReal * 100;

  // ── Render ──
  document.getElementById("result").style.display = "block";

  // Stop suggestion block (mode B only)
  const ssBl = document.getElementById("stop-suggestion");
  const qHero = document.getElementById("qty-hero");
  if (calcMode === "stop") {
    ssBl.style.display = "block";
    qHero.style.display = "none";
    document.getElementById("r-stop-suggested").textContent = fmtE(stopPrice, 4);
    document.getElementById("r-stop-suggested-sub").textContent =
      `Distance : ${fmtP(stopDist)} sous le prix réel (${fmtE(priceReal, 4)})`;
  } else {
    ssBl.style.display = "none";
    qHero.style.display = "block";
    document.getElementById("r-qty").textContent     = qty;
    document.getElementById("r-qty-sub").textContent = `× ${fmt(priceReal,4)} € = ${fmtE(invest)}`;
  }

  document.getElementById("r-invest").textContent    = fmtE(invest);
  document.getElementById("r-pct-cap").textContent   = fmtP(pctCap);
  document.getElementById("r-risk-eur").textContent  = fmtE(lossStop);
  document.getElementById("r-risk-pct").textContent  = fmtP(riskRealPct);
  document.getElementById("r-stop").textContent      = fmtE(stopPrice, 4);
  document.getElementById("r-stop-dist").textContent = fmtP(stopDist);

  // R-multiples
  const rRow = document.getElementById("r-targets");
  rRow.innerHTML = "";
  for (const r of [2, 3, 5]) {
    const tPrice = priceReal + r * riskPerShare;
    const gain   = qty * r * riskPerShare - 2 * fees;
    const chip   = document.createElement("div");
    chip.className = "r-chip";
    chip.innerHTML = `
      <div class="r-label">${r}R</div>
      <div class="r-val">${fmt(tPrice, 4)} €</div>
      <div class="r-gain">+${fmtE(gain)}</div>`;
    rRow.appendChild(chip);
  }

  // Warnings
  const warns = [];
  if (pctCap > 30) warns.push(`⚠️ Ligne à ${fmtP(pctCap)} du capital — dépasse la limite des 30%.`);
  if (riskRealPct > riskPct * 1.05) warns.push(`⚠️ Risque réel (${fmtP(riskRealPct)}) supérieur au seuil — effet des frais.`);
  if (calcMode === "stop" && stopDist < 2) warns.push(`⚠️ Stop très serré (${fmtP(stopDist)}) — risque de stop out sur volatilité normale.`);
  const wEl = document.getElementById("r-warning");
  wEl.innerHTML = warns.join("<br>");
  wEl.style.display = warns.length ? "block" : "none";

  document.getElementById("result").scrollIntoView({behavior:"smooth", block:"nearest"});
}

document.addEventListener("keydown", e => { if (e.key === "Enter") calculate(); });
loadDefaults();
</script>
</body>
</html>
